stages:
  - build
  - test
  - deploy

include:
  - local: 'default_variables.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE
      when: always

build_pipeline:
  stage: build
  trigger:
    include:
      - local: 'build/build.gitlab-ci.yml'
    strategy: depend
  rules:
    - when: always

test_pipeline:
  stage: test
  trigger:
    include:
      - local: 'test/test.gitlab-ci.yml'
    strategy: depend
  rules:
    - when: always

deploy_pipeline:
  stage: deploy
  trigger:
    include:
      - local: 'deploy/deploy.gitlab-ci.yml'
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never